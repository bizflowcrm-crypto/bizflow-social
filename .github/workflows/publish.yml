name: Publish scheduled posts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = post due items, dry-run = print only, verify = check the secrets work"
        type: choice
        options: [run, dry-run, verify]
        default: run

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish due posts
        env:
          IG_USER_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          ACCOUNTS_SECRETS: ${{ secrets.ACCOUNTS_SECRETS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GBP_LOCATION: ${{ secrets.GBP_LOCATION }}
          IGNORE_QUIET_HOURS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          case "${{ inputs.mode }}" in
            verify) python3 publisher/verify.py ;;
            dry-run) python3 publisher/publish.py --dry-run ;;
            *) python3 publisher/publish.py ;;
          esac
      - name: Save state
        if: always()
        run: |
          git config user.name "bizflow-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add publisher/state.json
          git diff --cached --quiet && exit 0
          git commit -m "publisher: update state [skip ci]"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
